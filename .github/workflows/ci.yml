name: CI

# Quality gate mirroring the local scripts: typecheck, lint, unit tests, build.
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks out and builds, never writes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # No Supabase env needed: routes are dynamic, so `next build` never
      # instantiates a client. This is a build-correctness gate, not a deploy.
      - name: Build
        run: pnpm build
